[package]
name = "payrole-nft"
description = "Non-transferable NEP-245 role NFTs with role-gated administration and salary streaming"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enables `tests/sandbox.rs`, which needs Docker and prebuilt wasm artifacts.
sandbox = []

[dependencies]
near-sdk.workspace = true
payrole-common.workspace = true
borsh.workspace = true
serde.workspace = true

[dev-dependencies]
anyhow = "1"
near-sdk = { workspace = true, features = ["unit-testing"] }
near-parameters = "0.38"
near-workspaces = "0.24"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
