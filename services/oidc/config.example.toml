# Example configuration for the payrole-oidc provider.
#
# Copy this file to config.toml (which is git-ignored), replace the URLs and
# account ids with your deployment, and run:
#
#   cargo run -p payrole-oidc -- services/oidc/config.toml
#
# The issuer must be the public, HTTPS base URL of this service. It is used as
# the JWT `iss` claim and as the prefix of every discovery URL, so it must match
# exactly what clients use (no trailing slash).

issuer = "https://payrole-oidc.plopmenz.openmesh.cloud"
listen = "127.0.0.1:8080"

# NEAR JSON-RPC endpoint used to call `roles_of` on the contract and to check
# that a NEP-413 public key is an access key of the claimed account.
rpc_url = "https://test.rpc.fastnear.com"
contract_id = "plopmenz.payrole-factory.testnet"

# NEAR network used by the wallet sign-in button on the login page. Defaults to
# the network implied by rpc_url.
network = "testnet"

# PKCS#8 PEM RSA private key used to sign JWTs. If this is omitted, a fresh
# ephemeral key is generated at startup and all tokens become invalid on
# restart. In production, generate a key and keep it secret:
#
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
#     -out services/oidc/signing-key.pem
#   chmod 600 services/oidc/signing-key.pem
#
signing_key_path = "services/oidc/signing-key.pem"

# NEP-413 recipient defaults to the host part of `issuer`.
# nep413_recipient = "auth.example.com"
#
# Optional callback URL included in the signed NEP-413 payload. Wallets that
# include a callback URL require this to be set to the exact same value.
# nep413_callback_url = "https://auth.example.com/callback"

access_token_ttl_secs = 900
id_token_ttl_secs = 900
authorization_code_ttl_secs = 300
pending_login_ttl_secs = 300

# Maximum number of live pending logins. `/authorize` is unauthenticated, so
# this caps memory use and returns 429 when the limit is reached.
max_pending_logins = 10000

# How often expired pending logins, authorization codes and sessions are swept.
store_sweep_interval_secs = 60

# Verify that the public key that signed the NEP-413 message is an access key
# of the claimed account. Keep this enabled outside throwaway experiments.
verify_access_key = true

allowed_scopes = ["openid", "profile", "roles"]

# Browser origins allowed to call /token and /userinfo with CORS. The hosted PayRole web app is
# a public PKCE client on a different origin, so it needs this. Exact origins only, no path.
allowed_origins = ["https://near-payrole.vercel.app"]

# The hosted PayRole web app. It uses OIDC only to prove which NEAR account is signed in; the
# app reads role NFTs from the contract registry itself. Keep required_roles empty so every
# wallet can inspect its own access, then add a role here if the login itself should be gated.
[[clients]]
client_id = "payrole-web"
name = "PayRole web"
redirect_uris = ["https://near-payrole.vercel.app/oidc/callback"]
required_roles = []
