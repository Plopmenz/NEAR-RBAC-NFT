      <stop offset="0" stop-color="#7cf5c8"/>
      <stop offset="1" stop-color="#54d9ff"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.1" cy="0" r="0.8">
      <stop offset="0" stop-color="#7cf5c8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7cf5c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="1" cy="0.1" r="0.7">
