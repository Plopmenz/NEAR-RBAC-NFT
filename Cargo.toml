[workspace]
resolver = "2"
members = [
    "crates/payrole-common",
    "contracts/payrole-nft",
    "contracts/payrole-factory",
    "services/oidc",
    "test-contracts/mock-ft",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Plopmenz/NEAR-RBAC-NFT"
rust-version = "1.95"

[workspace.dependencies]
payrole-common = { path = "crates/payrole-common" }
near-sdk = "5.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
borsh = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
overflow-checks = true
strip = "symbols"
